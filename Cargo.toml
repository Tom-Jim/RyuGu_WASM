[package]
name = "ryugu_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
regenerate-operators = []
eq106-dual-certificate = []

[[example]]
name = "generate_eq106_psi_table"
required-features = ["regenerate-operators"]

[dependencies]
bevy = { version = "0.19.1", features = ["webgpu","debug"] }
bevy_panorbit_camera = "0.35"
bevy_framepace = { version = "0.22.0", default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
bytemuck = "1"
num-complex = "0.4"
rand_chacha = "0.10"
rand_core = "0.10"
rustfft = "6"
wgpu29 = { package = "wgpu", version = "=29.0.4" }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
