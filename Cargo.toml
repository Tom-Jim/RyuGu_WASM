[package]
name = "ryugu_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19.0", features = ["webgpu","debug"] }
bevy_panorbit_camera = "0.35"
bevy_obj = "0.19.0"
bevy_framepace = { version = "0.22.0", default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
