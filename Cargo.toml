[package]
name = "ryugu_wasm"
version = "0.1.0"
edition = "2024"
description = "Browser-based WebGPU gravity and trajectory laboratory for asteroid Ryugu"
license = "MIT"
repository = "https://github.com/Tom-Jim/RyuGu_WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "bevy_gizmos", "webgpu"] }
bevy_panorbit_camera = "0.35"
bevy_framepace = { version = "0.22.0", default-features = false }
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
bytemuck = "1"
num-complex = "0.4"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
rand_distr = "0.6"
wgpu29 = { package = "wgpu", version = "=29.0.4" }

serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = "0.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
