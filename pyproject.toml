[project]
name = "ryugu-lut-generator"
version = "0.1.0"
description = "Generate Struve-Neumann LUT for Ryugu gravity solver"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]