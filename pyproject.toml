[project]
name = "ryugu-validation-tools"
version = "0.1.0"
description = "Validation and Wasmtime benchmarking tools for the Ryugu gravity simulator"
requires-python = "==3.14.6"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "wasmtime>=36.0.0",
    "pytest>=8.3.0",
]

[tool.uv]
python-preference = "managed"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
