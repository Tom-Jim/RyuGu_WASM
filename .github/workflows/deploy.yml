name: Deploy WebGPU WASM to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install web dependencies
              run: bun install --frozen-lockfile

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Lint WASM without dead code
              run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

            - name: Build WASM Release
              run: wasm-pack build --release --target web --out-dir pkg --out-name ryugu_wasm

            - name: Build Tailwind stylesheet
              run: bun run styles

            - name: Verify browser sources
              run: |
                  node --check src/html/ui.js
                  node --check src/html/app.js

            - name: Assemble Site Directory
              run: |
                  mkdir -p site/src/html
                  cp src/html/index.html site/index.html
                  cp src/html/ui.css src/html/ui.js src/html/app.js src/html/tailwind.generated.css site/src/html/
                  mkdir -p site/node_modules/vue/dist
                  cp node_modules/vue/dist/vue.esm-browser.prod.js site/node_modules/vue/dist/
                  cp -r assets site/ 2>/dev/null || true
                  cp -r pkg site/ 2>/dev/null || true

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
