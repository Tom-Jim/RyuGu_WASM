name: Deploy WebGPU WASM to GitHub Pages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install web dependencies
              run: bun install --frozen-lockfile

            - name: Install Zig
              uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Check formatting
              run: |
                  cargo fmt --all -- --check
                  cargo fmt --manifest-path src/backend/rust/Cargo.toml -- --check

            - name: Check production Rust library
              run: |
                  cargo clippy --locked --target wasm32-unknown-unknown --lib -- -D warnings
                  cargo check --locked --target wasm32-unknown-unknown --lib
                  cargo clippy --locked --target wasm32-unknown-unknown --manifest-path src/backend/rust/Cargo.toml -- -D warnings

            # Local serve is `bun start` or `bun .`. Bare `bun run` only lists scripts.
            - name: Build release WASM
              run: bun run build -- --fetch

            - name: Verify WASM ABI and generated module paths
              run: bun run check:wasm

            - name: Bundle Vue telemetry UI
              run: >-
                  bun build src/html/app.js --target=browser --production --minify
                  --define=__VUE_OPTIONS_API__=true
                  --define=__VUE_PROD_DEVTOOLS__=false
                  --define=__VUE_PROD_HYDRATION_MISMATCH_DETAILS__=false
                  --outfile=build/app.js

            - name: Verify browser sources
              run: |
                  node --check src/html/navigation.js
                  node --check src/html/ui.js
                  node --check src/html/capture.js
                  node --check src/html/visit.js
                  node --check src/html/app.js
                  node --check src/html/background.js
                  node --check src/html/background-worker.js
                  node --check src/html/backend-client.js
                  node --check src/html/backend-worker.js
                  node --check src/backend/host/cpp_backend.mjs
                  node --check src/tools/build_helpers.mjs
                  node --check src/tools/build_cpp_wasm.mjs
                  node --check src/tools/build_rust_backend.mjs
                  node --check src/tools/build_wasm.mjs
                  node --check src/tools/run.mjs
                  node --check build/app.js
                  ! grep -Fq 'Runtime compilation is not supported in this build of Vue' build/app.js
                  ! grep -Fq 'Feature flags __VUE_OPTIONS_API__' build/app.js

            - name: Assemble Site Directory
              run: |
                  mkdir -p site/src/html
                  cp src/html/index.html site/index.html
                  sed -i "s/__RYUGU_VERSION__/${GITHUB_SHA}/g" site/index.html
                  cp src/html/ui.css src/html/ui.js src/html/tailwind.generated.css site/src/html/
                  cp src/html/navigation.js site/src/html/
                  cp src/html/capture.js site/src/html/
                  cp src/html/visit.js site/src/html/
                  cp src/html/background.js src/html/background-worker.js site/src/html/
                  cp src/html/backend-client.js src/html/backend-worker.js site/src/html/
                  cp build/app.js site/src/html/app.js
                  cp -r assets site/
                  cp -r pkg site/

            - name: Verify GitHub Pages asset paths
              run: |
                  test -f site/index.html
                  test -f site/src/html/ui.css
                  test -f site/src/html/navigation.js
                  test -f site/src/html/ui.js
                  test -f site/src/html/capture.js
                  test -f site/src/html/visit.js
                  test -f site/src/html/app.js
                  test -f site/src/html/background.js
                  test -f site/src/html/background-worker.js
                  test -f site/src/html/backend-client.js
                  test -f site/src/html/backend-worker.js
                  test -f site/src/html/tailwind.generated.css
                  test -f site/pkg/ryugu_wasm.js
                  test -f site/pkg/ryugu_wasm_bg.wasm
                  test -f site/pkg/ryugu_backend.wasm
                  test -f site/pkg/backend.mjs
                  test -f site/pkg/backend/ryugu_backend.js
                  test -f site/pkg/backend/ryugu_backend_bg.wasm
                  test -f site/assets/models/ryugu.glb
                  test -f site/assets/models/cassini.gltf
                  test -f site/assets/models/cassini.bin
                  grep -Fq "${GITHUB_SHA}" site/index.html
                  ! grep -Eq '="/(src/html|pkg|node_modules)/' site/index.html
                  grep -Fq 'import(`./pkg/ryugu_wasm.js' site/index.html
                  ! grep -Fq 'from "vue"' site/src/html/app.js

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        if: github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    macos-arm64-optimization:
        if: github.event_name != 'pull_request'
        runs-on: macos-14
        continue-on-error: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Build native ARM64 numerical code
              env:
                  RUSTFLAGS: "-C target-cpu=native"
                  CARGO_PROFILE_RELEASE_LTO: "true"
                  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
              run: |
                  cargo build --locked --release --lib
                  cargo build --locked --release --manifest-path src/backend/rust/Cargo.toml

            - name: Inspect Apple acceleration capabilities
              run: |
                  sysctl -n hw.optional.arm64
                  system_profiler SPHardwareDataType
                  xcrun --find metal
                  xcrun --find coremlc || true
