name: Deploy WebGPU WASM to GitHub Pages

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install web dependencies
              run: bun install --frozen-lockfile

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Check production Rust library
              run: |
                  cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
                  cargo check --target wasm32-unknown-unknown --lib

            - name: Build WASM Release
              run: wasm-pack build --release --target web --out-dir pkg --out-name ryugu_wasm

            - name: Build Tailwind stylesheet
              run: bun run styles

            - name: Bundle Vue telemetry UI
              run: bun build src/html/app.js --target browser --minify --outfile build/app.js

            - name: Verify browser sources
              run: |
                  node --check src/html/ui.js
                  node --check src/html/app.js
                  node --check build/app.js
                  HITS_BADGE_SVG='<svg><title>site visits: 3 / 42</title></svg>' HITS_DATE=2026-01-02 bun scripts/update_hits_chart.mjs --check

            - name: Assemble Site Directory
              run: |
                  mkdir -p site/src/html
                  cp src/html/index.html site/index.html
                  cp src/html/ui.css src/html/ui.js src/html/tailwind.generated.css site/src/html/
                  cp build/app.js site/src/html/app.js
                  cp -r assets site/ 2>/dev/null || true
                  cp -r pkg site/ 2>/dev/null || true

            - name: Verify GitHub Pages asset paths
              run: |
                  test -f site/index.html
                  test -f site/src/html/ui.css
                  test -f site/src/html/ui.js
                  test -f site/src/html/app.js
                  test -f site/src/html/tailwind.generated.css
                  test -f site/pkg/ryugu_wasm.js
                  test -f site/pkg/ryugu_wasm_bg.wasm
                  ! grep -Eq '="/(src/html|pkg|node_modules)/' site/index.html
                  grep -Fq 'import(`./pkg/ryugu_wasm.js' site/index.html
                  ! grep -Fq 'from "vue"' site/src/html/app.js

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        if: github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
