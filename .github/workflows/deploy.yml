name: Deploy WebGPU WASM to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Build WASM Release
              run: wasm-pack build --release --target web --out-dir pkg

            - name: Assemble Site Directory & Auto-Fix Case Sensitivity
              run: |
                  mkdir -p site
                  cp index.html site/ 2>/dev/null || true
                  cp -r assets site/ 2>/dev/null || true
                  cp -r pkg site/ 2>/dev/null || true

                  # 【双重保险】自动复制生成大小写两种文件名，彻底斩断 404 报错！
                  cd site/pkg
                  if [ -f ryugu_wasm.js ]; then cp ryugu_wasm.js Ryugu_wasm.js; fi
                  if [ -f ryugu_wasm_bg.wasm ]; then cp ryugu_wasm_bg.wasm Ryugu_wasm_bg.wasm; fi

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
