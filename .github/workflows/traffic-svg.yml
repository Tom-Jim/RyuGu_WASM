name: Update site traffic SVG

on:
    schedule:
        - cron: "17 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: traffic-svg
    cancel-in-progress: true

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Update HITS history and SVG
              run: bun scripts/update_hits_chart.mjs

            - name: Commit updated traffic chart
              run: |
                  if git diff --quiet -- README.md assets/site-traffic.svg data/site-traffic.json; then
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md assets/site-traffic.svg data/site-traffic.json
                  git commit -m "docs: update site traffic chart"
                  git push
