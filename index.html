<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryugu WASM — WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #bevy { width: 100%; height: 100%; display: block; }
        #no-webgpu {
            display: none;
            position: fixed; inset: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: monospace;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            padding: 32px;
        }
        #no-webgpu h2 { color: #ff6b6b; font-size: 1.4rem; }
        #no-webgpu p  { font-size: 0.95rem; line-height: 1.6; max-width: 520px; color: #aaa; }
        #no-webgpu code { background: #1e1e1e; padding: 2px 6px; border-radius: 4px; color: #7ec8e3; }
    </style>
</head>
<body>
    <canvas id="bevy"></canvas>
    <div id="no-webgpu">
        <h2>⚠ WebGPU Not Available</h2>
        <p>This app requires <strong>WebGPU</strong>, which is not enabled in your browser.</p>
        <p>
            Use <code>Chrome 113+</code> or <code>Edge 113+</code> on a secure origin
            (<code>http://localhost</code> or <code>https://</code>).<br/>
            Firefox and Safari require enabling experimental flags.
        </p>
        <p>Check: <code>chrome://flags/#enable-unsafe-webgpu</code></p>
    </div>

    <script type="module">
        // WebGPU availability check before loading WASM
        if (!navigator.gpu) {
            document.getElementById('bevy').style.display = 'none';
            const el = document.getElementById('no-webgpu');
            el.style.display = 'flex';
        } else {
            // Verify we can actually get an adapter (some browsers lie about navigator.gpu)
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                document.getElementById('bevy').style.display = 'none';
                document.getElementById('no-webgpu').style.display = 'flex';
            } else {
                import('./pkg/ryugu_wasm.js').then(({ default: init }) => init());
            }
        }
    </script>
</body>
</html>
