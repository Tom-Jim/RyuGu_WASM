<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryugu WASM — WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        body {
            display: grid;
            place-items: center;
        }
        #viewport-frame {
            --display-scale: 1;
            --quarter-turn: 0;
            aspect-ratio: 16 / 9;
            transform: rotate(calc(var(--quarter-turn) * 90deg)) scale(var(--display-scale));
            transform-origin: center;
        }
        #bevy { width: 100%; height: 100%; display: block; }
        #no-webgpu {
            display: none;
            position: fixed; inset: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: monospace;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            padding: 32px;
        }
        #no-webgpu h2 { color: #ff6b6b; font-size: 1.4rem; }
        #no-webgpu p  { font-size: 0.95rem; line-height: 1.6; max-width: 520px; color: #aaa; }
        #no-webgpu code { background: #1e1e1e; padding: 2px 6px; border-radius: 4px; color: #7ec8e3; }
    </style>
</head>
<body>
    <div id="viewport-frame">
        <canvas id="bevy"></canvas>
    </div>
    <div id="no-webgpu">
        <h2>⚠ WebGPU Not Available</h2>
        <p>This app requires <strong>WebGPU</strong>, which is not enabled in your browser.</p>
        <p>
            Use <code>Chrome 113+</code> or <code>Edge 113+</code> on a secure origin
            (<code>http://localhost</code> or <code>https://</code>).<br/>
            Firefox and Safari require enabling experimental flags.
        </p>
        <p>Check: <code>chrome://flags/#enable-unsafe-webgpu</code></p>
    </div>

    <script type="module">
        const viewportFrame = document.getElementById('viewport-frame');

        function updateViewportFrame() {
            const aspectRatio = 16 / 9;
            const frameWidth = Math.min(window.innerWidth, window.innerHeight * aspectRatio);
            const frameHeight = frameWidth / aspectRatio;
            const quarterTurn = Number(viewportFrame.dataset.quarterTurn ?? 0) % 4;
            const rotatedWidth = quarterTurn % 2 === 0 ? frameWidth : frameHeight;
            const rotatedHeight = quarterTurn % 2 === 0 ? frameHeight : frameWidth;
            const scale = Math.min(
                window.innerWidth / rotatedWidth,
                window.innerHeight / rotatedHeight,
            );

            viewportFrame.style.width = `${frameWidth}px`;
            viewportFrame.style.height = `${frameHeight}px`;
            viewportFrame.style.setProperty('--display-scale', String(scale));
        }

        window.setRyuguDisplayRotation = (quarterTurn) => {
            const normalizedTurn = ((Number(quarterTurn) % 4) + 4) % 4;
            viewportFrame.dataset.quarterTurn = String(normalizedTurn);
            viewportFrame.style.setProperty('--quarter-turn', String(normalizedTurn));
            updateViewportFrame();
        };

        window.addEventListener('resize', updateViewportFrame, { passive: true });
        window.setRyuguDisplayRotation(0);

        // WebGPU availability check before loading WASM
        if (!navigator.gpu) {
            document.getElementById('bevy').style.display = 'none';
            const el = document.getElementById('no-webgpu');
            el.style.display = 'flex';
        } else {
            // Verify we can actually get an adapter (some browsers lie about navigator.gpu)
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                document.getElementById('bevy').style.display = 'none';
                document.getElementById('no-webgpu').style.display = 'flex';
            } else {
                // Reuse the page's optional `?v=` cache key for both glue and
                // WASM so a newly built physics kernel cannot be paired with a
                // stale browser-cached binary during verification/deployment.
                const version = new URL(window.location.href).searchParams.get('v');
                const suffix = version ? `?v=${encodeURIComponent(version)}` : '';
                import(`./pkg/ryugu_wasm.js${suffix}`).then(({ default: init }) =>
                    init(`./pkg/ryugu_wasm_bg.wasm${suffix}`)
                );
            }
        }
    </script>
</body>
</html>
